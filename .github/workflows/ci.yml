name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: browser-actions/setup-chrome@v1
      - run: npm ci
      - run: npm run browser:ci:verify

  deployment-probe:
    if: ${{ vars.DEPLOYMENT_BASE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run deployment:probe
        env:
          DEPLOYMENT_BASE_URL: ${{ vars.DEPLOYMENT_BASE_URL }}

  browser-safari:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run browser:safari:verify
        env:
          SAFARI_REQUIRE_SESSION: "1"

  browser-firefox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: browser-actions/setup-firefox@v1
      - uses: browser-actions/setup-geckodriver@v0.0.0
      - run: npm ci
      - run: npm run browser:firefox:verify
        env:
          SAFARI_REQUIRE_SESSION: "1"

  browser-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: browser-actions/setup-edge@v1
      - run: npm ci
      - run: npm run browser:edge:verify
        env:
          DBUS_SESSION_BUS_ADDRESS: /dev/null
